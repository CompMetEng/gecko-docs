name: Guide examples

# Runs the Python and MATLAB snippets of the guide pages in the executed set and
# checks that they still print what the page says they print. See
# scripts/run_examples.py and docs/guide/executed-examples.md.
#
# The submodules are bumped automatically (update-submodules.yml), so the weekly
# schedule is what catches an upstream API change that silently invalidates a
# documented output; the pull_request trigger catches a page that was written
# with a snippet that never ran.

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/guide/**"
      - "docs/data/**"
      - "scripts/run_examples.py"
      - "scripts/project.yml"
      - ".github/workflows/examples.yml"
      - "GECKO"
      - "geckopy"
  pull_request:
    paths:
      - "docs/guide/**"
      - "docs/data/**"
      - "scripts/run_examples.py"
      - "scripts/project.yml"
      - ".github/workflows/examples.yml"
      - "GECKO"
      - "geckopy"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # geckopy is installed from the submodule, so the docs are always
          # checked against the exact commit the API reference is generated from.
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install geckopy from the submodule
        run: |
          python -m pip install --upgrade pip
          # GLPK arrives as a wheel via cobrapy's optlang/swiglpk dependency, so
          # no system solver has to be installed. openpyxl is needed by the Excel
          # export example.
          python -m pip install ./geckopy openpyxl pyyaml

      - name: Report versions
        run: |
          python -c "import cobra, geckopy, raven_toolbox, optlang; print('cobra', cobra.__version__); print('geckopy', geckopy.__version__); print('raven_toolbox', raven_toolbox.__version__); print('solvers', sorted(optlang.available_solvers))"

      - name: Run guide examples
        run: python scripts/run_examples.py --language python

  matlab:
    name: MATLAB examples
    runs-on: ubuntu-latest
    # MATLAB takes a minute to start, and the pages solve linear problems of an
    # ecModel with the GLPK that comes with RAVEN.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # RAVEN 3 is not a submodule of this repository: the develop branch of
      # RAVEN is the one that GECKO 4 is developed against.
      - uses: actions/checkout@v7
        with:
          repository: CompMetEng/RAVEN
          ref: develop
          path: RAVEN

      # Free of charge on GitHub-hosted runners for public repositories.
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          # ecFVA runs its linear problems in parallel.
          products: Parallel_Computing_Toolbox

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # scripts/project.py reads scripts/project.yml with PyYAML.
      - name: Install PyYAML
        run: python -m pip install pyyaml

      # MATLAB on a GitHub-hosted runner is licensed only when one of the
      # matlab-actions run-* actions starts it -- starting matlab ourselves fails
      # the license checkout. So the harness is prepared here, run by the action,
      # and its output checked afterwards: the same tool, the same pages, in
      # three steps instead of one.
      - name: Prepare the MATLAB harness
        run: >
          python scripts/run_examples.py --language matlab
          --matlab-prepare "${{ runner.temp }}/matlab-harness"

      - uses: matlab-actions/run-command@v3
        with:
          command: >
            addpath('${{ runner.temp }}/matlab-harness');
            docs_run('${{ runner.temp }}/matlab-harness')

      - name: Check the MATLAB output
        run: >
          python scripts/run_examples.py --language matlab
          --matlab-collect "${{ runner.temp }}/matlab-harness"
