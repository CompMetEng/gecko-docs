# Settings of this documentation site that the scripts in this folder read.
# Nothing else in scripts/ names the project.
cobrapy: true
matlab:
  name: GECKO
  path: GECKO/src
  categories:
  - folder: change_model
    title: Build & edit ecModel
  - folder: download_databases
    title: Download databases
  - folder: enzyme_usage
    title: Enzyme usage
  - folder: flux_analysis
    title: Flux analysis
  - folder: gather_kcats
    title: Gather kcats
  - folder: get_enzyme_data
    title: Enzyme & EC data
  - folder: io
    title: Input / output
  - folder: kcat_tuning
    title: kcat tuning
  - folder: limit_proteins
    title: Limit proteins
  - folder: model_adapter
    title: Model adapter
  - folder: utilities
    title: Utilities
  excluded_folders:
  - dlkcat-gecko
python:
  name: geckopy
  package: geckopy
  path: geckopy/src/geckopy
  package_titles:
    ec_model: Build & edit ecModel
    gather_kcats: Gather kcats
    get_enzyme_data: Enzyme & EC data
    kcat_tuning: kcat tuning
    limit_proteins: Limit proteins
    adapter: Model adapter
    utilities: Utilities
    databases: Databases
    _toplevel: Top-level
examples:
  solver: glpk
  matlab_preferences:
    group: RAVEN
    keys:
    - solver
    - progressBar
    - ravenPath
  matlab_start: "% RAVEN is not part of this repository. DOCS_RAVEN names its folder; without it\n% the folder RAVEN next to GECKO is used.\ndocsrun_raven = getenv('DOCS_RAVEN');\nif isempty(docsrun_raven)\n    docsrun_raven = fullfile(fileparts(fileparts(fileparts('@MATLAB_SRC@'))), 'RAVEN');\nend\naddpath(genpath(docsrun_raven));\n% GECKOInstaller.m sits in the root of GECKO, one folder above src.\naddpath(fileparts('@MATLAB_SRC@'));\nsetpref('RAVEN', 'ravenPath', docsrun_raven);\n% Progress bars redraw with carriage returns and pick their milestones from the\n% terminal width, so the captured text would differ from machine to machine.\ntry\n    setRavenProgress('none');\ncatch docsrun_err\n    fprintf(2, 'could not silence progress reporting: %s\\n', docsrun_err.message);\nend\n"
  matlab_page_start: "    % setRavenSolver writes a MATLAB preference, which outlives the page\n    % that set it, so it is set again for every page.\n    try\n        setRavenSolver('@SOLVER@');\n    catch docsrun_err\n        fprintf(2, 'could not select solver: %s\\n', docsrun_err.message);\n    end\n"
